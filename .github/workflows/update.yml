name: update-jobs

on:
  schedule:
    - cron: "0 */6 * * *"     # every 6 hours (UTC)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install python-jobspy || echo "jobspy unavailable, skipping LinkedIn/Indeed/Naukri"
      - name: Run jobhunt
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python jobhunt.py
      - name: Commit results
        run: |
          git config user.name "jobhunt-bot"
          git config user.email "bot@users.noreply.github.com"
          git add JOBS.md jobs.csv data
          git diff --staged --quiet || git commit -m "update listings $(date -u +%F\ %H:%M)"
          git push
